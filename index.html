    <script>
      // Gracefully silence sandbox iframe WebSocket disconnection errors from Vite HMR
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.indexOf('WebSocket closed without opened') !== -1 ||
          event.message.indexOf('@vite/client') !== -1 ||
          event.message.indexOf('WebSocket') !== -1
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).indexOf('WebSocket closed without opened') !== -1 ||
          String(event.reason).indexOf('@vite/client') !== -1 ||
          String(event.reason).indexOf('WebSocket') !== -1
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
